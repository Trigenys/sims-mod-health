name: Landing Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R apps/landing/. _site/
          rm -f _site/README.md _site/vercel.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy landing
        id: deployment
        uses: actions/deploy-pages@v4

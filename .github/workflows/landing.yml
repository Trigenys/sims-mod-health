name: Landing CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "scripts/landing/**"
      - ".github/workflows/landing.yml"
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "scripts/landing/**"
      - ".github/workflows/landing.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check landing JavaScript syntax
        run: node --check apps/landing/app.js

      - name: Validate landing contract
        run: node scripts/landing/validate.mjs

      - name: Serve and request landing
        shell: bash
        run: |
          python3 -m http.server 4173 --directory apps/landing >/tmp/smh-landing.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -q "Download for Windows"
          curl --fail --silent --show-error http://127.0.0.1:4173/styles.css >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/app.js >/dev/null

name: Landing CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "scripts/landing/**"
      - ".github/workflows/landing.yml"
      - ".github/workflows/landing-pages.yml"

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check landing JavaScript syntax
        run: |
          node --check apps/landing/release.js
          node --check apps/landing/i18n.js
          node --check scripts/landing/build-stitch.mjs
          node --check scripts/landing/site-pages.mjs
          node --check scripts/landing/validate.mjs

      - name: Build approved Stitch landing
        run: node scripts/landing/build-stitch.mjs

      - name: Validate landing contract
        run: node scripts/landing/validate.mjs

      - name: Serve and request landing
        shell: bash
        run: |
          python3 -m http.server 4173 --directory _site >/tmp/smh-landing.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:4173/ | grep -q "Keep your Sims 4 Mods healthy"
          curl --fail --silent --show-error http://127.0.0.1:4173/release.js >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/i18n.js | grep -q "smh-language"
          curl --fail --silent --show-error http://127.0.0.1:4173/logo.svg >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/download/ | grep -q "Download Sims Mod Health"
          curl --fail --silent --show-error http://127.0.0.1:4173/release-notes/ | grep -q "Beta 1 release notes"
          curl --fail --silent --show-error http://127.0.0.1:4173/verify/ | grep -q "Verify your download"
          curl --fail --silent --show-error http://127.0.0.1:4173/docs/ | grep -q "Documentation"

name: Windows installer validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-validate:
    name: build / install / uninstall
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate release automation contract
        run: node scripts/release/validate-release-automation.mjs

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-beta-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-beta-cargo-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows MSI from this commit
        run: npm run tauri build -- --bundles msi

      - name: Locate MSI
        id: installer
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1

          if (-not $msi) {
            throw "Tauri build completed without producing an MSI."
          }

          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($msi.FullName)"

      - name: Verify clean Windows install and uninstall
        shell: pwsh
        run: |
          ./scripts/release/validate-windows-installer.ps1 -MsiPath "${{ steps.installer.outputs.path }}"

      - name: Upload validated installer evidence
        uses: actions/upload-artifact@v6
        with:
          name: sims-mod-health-windows-validation
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7

name: Product release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - "scripts/release/**"
      - "release-please-config.json"
      - ".release-please-manifest.json"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    uses: EagleFox31/appfactory-project-automation/.github/workflows/release-tauri-desktop.yml@2856fc410ecd4b50b7ec5a58ac32d692dcd47170
    with:
      product-name: Sims-Mod-Health
      working-directory: .
      node-version: "24"
      target-branch: main
      release-config-file: release-please-config.json
      release-manifest-file: .release-please-manifest.json

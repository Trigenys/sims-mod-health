name: Rust CI

on:
  workflow_call:
    inputs:
      run_xdelta_benchmark:
        description: Run the isolated xdelta R&D benchmark and publish its metrics.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run_xdelta_benchmark:
        description: Run the isolated xdelta R&D benchmark and publish its metrics.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run xdelta R&D benchmark
        if: ${{ inputs.run_xdelta_benchmark }}
        run: cargo test --manifest-path src-tauri/Cargo.toml delta::tests::eight_megabyte_fixture_benchmark -- --ignored --exact --nocapture

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      rust: ${{ steps.scope.outputs.rust }}
      registry: ${{ steps.scope.outputs.registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect affected stacks
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "registry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"

          frontend=false
          rust=false
          registry=false

          while IFS= read -r file; do
            case "$file" in
              src/*|package.json|package-lock.json|index.html|vite.config.*|tsconfig*.json)
                frontend=true
                ;;
            esac

            case "$file" in
              src-tauri/*)
                rust=true
                ;;
            esac

            case "$file" in
              services/registry-api/*)
                registry=true
                ;;
            esac
          done <<< "$changed_files"

          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

          {
            echo "### CI scope"
            echo
            echo "| Stack | Run |"
            echo "| --- | --- |"
            echo "| Frontend | $frontend |"
            echo "| Rust / Tauri | $rust |"
            echo "| Registry API | $registry |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run native tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  registry:
    needs: changes
    if: needs.changes.outputs.registry == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: sims_mod_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d sims_mod_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REGISTRY_DATABASE_URL: postgresql+psycopg://registry:registry@localhost:5432/sims_mod_health
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install registry API
        working-directory: services/registry-api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify fresh and reversible Alembic migration
        working-directory: services/registry-api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Run registry tests
        working-directory: services/registry-api
        run: pytest -q
